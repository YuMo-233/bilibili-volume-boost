<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9DB8"/>
      <stop offset="1" stop-color="#E4547E"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4547E"/>
      <stop offset="1" stop-color="#C23A63"/>
    </linearGradient>
  </defs>

  <!-- 粉色渐变圆角底 -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>

  <!-- 顶部 V 型双天线（小电视标志，圆角线，无球） -->
  <path d="M64 30 L46 12" stroke="#FFEBF1" stroke-width="6" stroke-linecap="round"/>
  <path d="M64 30 L82 12" stroke="#FFEBF1" stroke-width="6" stroke-linecap="round"/>

  <!-- 机身：白色小电视 -->
  <rect x="22" y="30" width="84" height="72" rx="16" fill="#FFFFFF"/>
  <rect x="22" y="96" width="84" height="6" rx="3" fill="#EFEFEF"/>

  <!-- 底座（浅粉描边块） -->
  <rect x="22" y="100" width="84" height="8" rx="4" fill="url(#base)"/>

  <!-- 屏幕 -->
  <rect x="32" y="40" width="64" height="44" rx="10" fill="#2B2B3B"/>

  <!-- 屏幕内：音量波形条（粉色，从左到右增高 = 增益） -->
  <rect x="42" y="66" width="9" height="8"  rx="2" fill="#FF6B97"/>
  <rect x="55" y="60" width="9" height="14" rx="2" fill="#FF6B97"/>
  <rect x="68" y="53" width="9" height="21" rx="2" fill="#FF6B97"/>
  <rect x="81" y="47" width="9" height="27" rx="2" fill="#FF8FB0"/>

  <!-- 波形顶端小亮点（增幅语义） -->
  <circle cx="85.5" cy="44" r="2.5" fill="#FFD3E0"/>
</svg>